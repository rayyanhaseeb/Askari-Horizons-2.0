<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="output">Running...</div>
  <script>
    async function run() {
      const worker = await Tesseract.createWorker('eng');
      const res = await worker.recognize('../reference/strip-crop.png');
      const resHero = await worker.recognize('../reference/hero-text-crop.png');
      document.getElementById('output').innerText = JSON.stringify({
        strip: res.data.text.trim(),
        hero: resHero.data.text.trim()
      }, null, 2);
      await worker.terminate();
      console.log('DONE');
    }
    run().catch(e => { document.getElementById('output').innerText = e.stack; });
  </script>
</body>
</html>
